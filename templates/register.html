{% extends "layout.html" %}

{% block title %}Register{% endblock %}

{% block main %}
    <h2>Register</h2>
    <form action="/register" method="post" class="mt-3">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control w-auto mx-auto" name="username" placeholder="Username" type="text" required>
        </div>
        <div class="mb-3">
            <input class="form-control w-auto mx-auto" name="password" placeholder="Password" type="password" required>
        </div>
        <div class="mb-3">
            <input class="form-control w-auto mx-auto" name="confirmation" placeholder="Confirm password" type="password" required>
        </div>
        <button class="btn btn-primary" type="submit">Register</button>
    </form>
{% endblock %}
