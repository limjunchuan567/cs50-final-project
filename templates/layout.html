<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Mood Tracker: {% block title %}{% endblock %}</title>
</head>
<body>
    <nav class="navbar navbar-expand-md bg-light border-bottom">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🎵 Mood Tracker</a>
            <ul class="navbar-nav ms-auto flex-row gap-3">
                {% if session["user_id"] %}
                    <li class="nav-item"><a class="nav-link" href="/add">Add song</a></li>
                    <li class="nav-item"><a class="nav-link" href="/playlist">Playlist</a></li>
                    <li class="nav-item"><a class="nav-link" href="/logout">Log out</a></li>
                {% else %}
                    <li class="nav-item"><a class="nav-link" href="/register">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login">Log in</a></li>
                {% endif %}
            </ul>
        </div>
    </nav>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="alert alert-primary mb-0 text-center" role="alert">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <main class="container py-5 text-center">
        {% block main %}{% endblock %}
    </main>
</body>
</html>
