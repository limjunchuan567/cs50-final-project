{% extends "layout.html" %}

{% block title %}Add song{% endblock %}

{% block main %}
    <h2>Add a song</h2>
    <form action="/add" method="post" class="mt-3">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control w-auto mx-auto" name="title" placeholder="Song title" type="text" required>
        </div>
        <div class="mb-3">
            <input autocomplete="off" class="form-control w-auto mx-auto" name="artist" placeholder="Artist" type="text" required>
        </div>
        <div class="mb-3">
            <input autocomplete="off" class="form-control mx-auto" style="max-width: 400px" name="url" placeholder="Spotify track or YouTube link" type="text" required>
        </div>
        <button class="btn btn-primary" type="submit">Next: pick moods</button>
    </form>
{% endblock %}
