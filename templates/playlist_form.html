{% extends "layout.html" %}

{% block title %}How are you feeling?{% endblock %}

{% block main %}
    <h2>How are you feeling?</h2>
    <form action="/playlist" method="post" class="mt-3">
        <div class="mb-3">
            <select class="form-select w-auto mx-auto" name="mood_id" required>
                <option value="" disabled selected>Choose a mood</option>
                {% for mood in moods %}
                    <option value="{{ mood.id }}">{{ mood.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="length" class="form-label">Songs</label>
            <input class="form-control w-auto mx-auto" id="length" name="length"
                   type="number" min="1" max="25" value="{{ default_length }}">
        </div>
        <button class="btn btn-primary" type="submit">Make my playlist</button>
    </form>
{% endblock %}
